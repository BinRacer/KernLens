<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 168" preserveAspectRatio="xMidYMid meet" width="100%" role="img" aria-labelledby="banner-title banner-desc">
    <title id="banner-title">KernLens</title>
    <desc id="banner-desc">KernLens — Linux kernel introspection for GDB, 40 kl-* commands for page tables, SLUB, symbols, and KASLR</desc>
    <defs>
        <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4361ee"/>
            <stop offset="100%" stop-color="#7209b7"/>
        </linearGradient>
        <style>
            text {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Helvetica, Arial, sans-serif;
                text-anchor: middle;
            }
            .wordmark {
                font-size: 58px;
                font-weight: 800;
                letter-spacing: -1px;
                fill: url(#wordmark);
            }
            /* Not the old grey: GitHub renders this image on light
               #ffffff and on dark #0d1117, and #6b7280 clears 4.5:1 on
               both (4.8:1 and 4.9:1).  A single-file banner cannot swap
               colours per theme, so the fill has to work in both places.
               (No angle brackets in these comments: this is XML text, and
               a raw one would be parsed as the start of a tag.) */
            .tagline {
                font-size: 19px;
                font-weight: 500;
                fill: #6b7280;
            }
            /* The one piece of information the old banner lacked: what the
               tool actually gives you.  Monospace because the commands are
               typed, and #8b5cf6 reads on both themes. */
            .surface {
                font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                    Consolas, monospace;
                font-size: 14px;
                font-weight: 500;
                fill: #8b5cf6;
            }
        </style>
    </defs>

    <text class="wordmark" x="50%" y="60">KernLens</text>
    <text class="tagline" x="50%" y="104">Linux kernel introspection for GDB</text>
    <text class="surface" x="50%" y="136">40 kl-* commands · page tables · SLUB · symbols · KASLR</text>
</svg>