# Documentation site configuration.
#
# Built by `.github/workflows/docs.yml` on every push to main and deployed
# to GitHub Pages.  The nav is the page list: `tools/gen_docs_site.py`
# reads it to build `docs/llms.txt`, and `tests/unit/test_docs_site.py`
# fails when a page exists but is not reachable from here (or from the
# generated tutorial index).
#
# Two languages, one directory each.  `mkdocs-static-i18n` pairs
# `docs/en/x.md` with `docs/zh-CN/x.md`, builds the default language on
# the site root, and gives every other locale a `/<locale>/` prefix -- so
# English keeps `/` and `/tutorial/`, and Chinese lives at `/zh-CN/`,
# which is where the previous hand-rolled layout already put it.
#
# `docs/en/index.md` and `docs/zh-CN/index.md` are generated from the two
# READMEs; do not edit them.

site_name: KernLens
site_description: Linux kernel debugging from Python and GDB
site_url: https://binracer.github.io/KernLens/
repo_url: https://github.com/BinRacer/KernLens
repo_name: BinRacer/KernLens
edit_uri: edit/main/docs/
copyright: GPL-3.0-or-later

docs_dir: docs
site_dir: site

theme:
  name: material
  # `overrides/` carries the language switcher; the theme has no slot for
  # a control that is not search, palette, or repo.
  custom_dir: overrides
  language: en
  features:
    # Tabs put the top level of the nav in the header and leave the
    # sidebar to the section you have chosen.  Without them the sidebar
    # has to carry both, and with 30 command pages under Tutorial the
    # other sections end up below a wall of command names.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.select
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
      # The default slugify strips non-ASCII, so the Chinese headings got
      # empty anchors and every ``#安装`` link dangled.  pymdownx keeps
      # the characters, which is what GitHub does too.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

# The language switcher, in the theme's own slot for it.
#
# `extra.alternate` renders `partials/alternate.html`: a translate icon in
# the header, on the same row as the palette toggle and the search box.
# That is the pattern a reader already knows, and it costs no custom
# markup.  A button in the content area reads as part of the page rather
# than as a site-wide control.
#
# The links are absolute because the switcher appears on pages at
# different depths.  They point at the other language's front page rather
# than a translation of the current page: `mkdocs-static-i18n` can map
# page to page, but only when the counterpart exists, and a nav entry that
# silently lands on the wrong page is worse than one that lands on a
# known page.
extra:
  alternate:
    - name: English
      link: https://binracer.github.io/KernLens/
      lang: en
    - name: 简体中文
      link: https://binracer.github.io/KernLens/zh-CN/
      lang: zh-CN

validation:
  # Absolute links go to GitHub, the issue tracker, and the PyPI project
  # page; they are not claims about files in this site.
  links:
    absolute_links: ignore
    unrecognized_links: warn
  anchors: warn

hooks:
  # `theme.language` is the theme's own UI strings and one value per
  # build, so the Chinese pages would declare themselves English; the
  # hook rewrites `<html lang>` per page.
  - hooks/language.py

plugins:
  - i18n:
      docs_structure: folder
      # A Chinese page with no counterpart is still served under
      # `/zh-CN/`, built from the English source.  `false` would make it
      # a 404; `true` makes the URL work and the content be English,
      # which the page itself says.  The alternative -- translating
      # every command page -- is 40 pages of output that would rot the
      # moment a command changed.
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh-CN
          name: 简体中文
          build: true
          theme:
            # `theme.language` picks the Material translation file for the
            # UI chrome (search placeholder, "Back to top", the table of
            # contents label).  Material ships `zh`, not `zh-CN`, and the
            # locale name is also the URL segment, which stays `zh-CN`.
            language: zh
          nav:
            # A separate nav, not a translation of the English one.
            # Material has no way to label the same page differently per
            # locale, and the point of the Chinese site is that a reader
            # who chose Chinese gets Chinese links that lead to Chinese
            # pages.  Only the command reference is English-only, and it
            # says so in its own heading.
            - 首页: index.md
            - 命令参考: commands.md
            - 教程:
              - 索引: tutorial/README.md
              # BEGIN GENERATED TUTORIAL NAV -- tools/gen_docs_site.py
              - overview:
                - kl-status: en/tutorial/kl-status.md
              - kernel base & KASLR:
                - kl-base: en/tutorial/kl-base.md
              - kernel metadata:
                - kl-kcmdline: en/tutorial/kl-kcmdline.md
                - kl-kversion: en/tutorial/kl-kversion.md
                - kl-kconfig: en/tutorial/kl-kconfig.md
                - kl-kmod: en/tutorial/kl-kmod.md
                - kl-ksyscalls: en/tutorial/kl-ksyscalls.md
                - kl-kdmesg: en/tutorial/kl-kdmesg.md
              - addresses & page tables:
                - kl-addr: en/tutorial/kl-addr.md
                - kl-pt: en/tutorial/kl-pt.md
                - kl-walk: en/tutorial/kl-walk.md
                - kl-p2v: en/tutorial/kl-p2v.md
                - kl-v2p: en/tutorial/kl-v2p.md
                - kl-pageinfo: en/tutorial/kl-pageinfo.md
              - memory & symbols:
                - kl-buddy: en/tutorial/kl-buddy.md
                - kl-slab: en/tutorial/kl-slab.md
                - kl-sym: en/tutorial/kl-sym.md
                - kl-bt: en/tutorial/kl-bt.md
                - kl-read: en/tutorial/kl-read.md
                - kl-kvar: en/tutorial/kl-kvar.md
                - kl-read-field: en/tutorial/kl-read-field.md
                - kl-kbpf: en/tutorial/kl-kbpf.md
                - kl-kdmabuf: en/tutorial/kl-kdmabuf.md
              - CPU topology:
                - kl-cpu: en/tutorial/kl-cpu.md
                - kl-percpu: en/tutorial/kl-percpu.md
                - kl-msr: en/tutorial/kl-msr.md
              - bit & integer primitives:
                - kl-bits: en/tutorial/kl-bits.md
                - kl-int: en/tutorial/kl-int.md
              - output:
                - kl-color: en/tutorial/kl-color.md
              - help:
                - kl-help: en/tutorial/kl-help.md
              # END GENERATED TUTORIAL NAV
            - 演示容器: demo-container.md
            - Python API: api.md
            - 架构: architecture.md
            - 兼容性: compatibility.md
            - 发布: releasing.md
            - 命名约定: naming.md
            - 参与贡献: https://github.com/BinRacer/KernLens/blob/main/CONTRIBUTING.zh-CN.md
            - 安全: https://github.com/BinRacer/KernLens/blob/main/SECURITY.md
            - 变更日志: https://github.com/BinRacer/KernLens/blob/main/CHANGELOG.md
  - search

# English is the default language, so English is what the root nav shows.
# Targets are relative to `docs/`, which is why they carry the `en/`
# prefix: the plugin pairs `en/x.md` with `zh-CN/x.md`, and the default
# language's prefix is dropped from the URL, not from the file path.
nav:
  - Overview: en/index.md
  - Commands: en/commands.md
  - Tutorial:
    - Index: en/tutorial/README.md
    # BEGIN GENERATED TUTORIAL NAV -- tools/gen_docs_site.py
    - overview:
      - kl-status: en/tutorial/kl-status.md
    - kernel base & KASLR:
      - kl-base: en/tutorial/kl-base.md
    - kernel metadata:
      - kl-kcmdline: en/tutorial/kl-kcmdline.md
      - kl-kversion: en/tutorial/kl-kversion.md
      - kl-kconfig: en/tutorial/kl-kconfig.md
      - kl-kmod: en/tutorial/kl-kmod.md
      - kl-ksyscalls: en/tutorial/kl-ksyscalls.md
      - kl-kdmesg: en/tutorial/kl-kdmesg.md
    - addresses & page tables:
      - kl-addr: en/tutorial/kl-addr.md
      - kl-pt: en/tutorial/kl-pt.md
      - kl-walk: en/tutorial/kl-walk.md
      - kl-p2v: en/tutorial/kl-p2v.md
      - kl-v2p: en/tutorial/kl-v2p.md
      - kl-pageinfo: en/tutorial/kl-pageinfo.md
    - memory & symbols:
      - kl-buddy: en/tutorial/kl-buddy.md
      - kl-slab: en/tutorial/kl-slab.md
      - kl-sym: en/tutorial/kl-sym.md
      - kl-bt: en/tutorial/kl-bt.md
      - kl-read: en/tutorial/kl-read.md
      - kl-kvar: en/tutorial/kl-kvar.md
      - kl-read-field: en/tutorial/kl-read-field.md
      - kl-kbpf: en/tutorial/kl-kbpf.md
      - kl-kdmabuf: en/tutorial/kl-kdmabuf.md
    - CPU topology:
      - kl-cpu: en/tutorial/kl-cpu.md
      - kl-percpu: en/tutorial/kl-percpu.md
      - kl-msr: en/tutorial/kl-msr.md
    - bit & integer primitives:
      - kl-bits: en/tutorial/kl-bits.md
      - kl-int: en/tutorial/kl-int.md
    - output:
      - kl-color: en/tutorial/kl-color.md
    - help:
      - kl-help: en/tutorial/kl-help.md
    # END GENERATED TUTORIAL NAV
  - Demo container: en/demo-container.md
  - Python API: en/api.md
  - Architecture: en/architecture.md
  - Compatibility: en/compatibility.md
  - Releasing: en/releasing.md
  - Naming: en/naming.md
  # Outside the site directory, so these stay on GitHub rather than
  # becoming a second copy that drifts.
  - Contributing: https://github.com/BinRacer/KernLens/blob/main/CONTRIBUTING.md
  - Security: https://github.com/BinRacer/KernLens/blob/main/SECURITY.md
  - Changelog: https://github.com/BinRacer/KernLens/blob/main/CHANGELOG.md
