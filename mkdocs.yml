# Documentation site configuration.
#
# Built by `.github/workflows/docs.yml` on every push to main and deployed
# to GitHub Pages.  The nav is the page list: `tools/gen_docs_site.py`
# reads it to build `docs/llms.txt`, and `tests/unit/test_docs_site.py`
# fails when a page exists but is not reachable from here (or from the
# generated tutorial index).
#
# `docs/index.md` and `docs/index.zh-CN.md` are generated from the two
# READMEs; do not edit them.

site_name: KernLens
site_description: Linux kernel debugging from Python and GDB
site_url: https://binracer.github.io/KernLens/
repo_url: https://github.com/BinRacer/KernLens
repo_name: BinRacer/KernLens
edit_uri: edit/main/docs/
copyright: GPL-3.0-or-later

docs_dir: docs
site_dir: site

theme:
  name: material
  # `overrides/` carries the language switcher; the theme has no slot for
  # a control that is not search, palette, or repo.
  custom_dir: overrides
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.select
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
      # The default slugify strips non-ASCII, so the Chinese headings got
      # empty anchors and every ``#安装`` link dangled.  pymdownx keeps
      # the characters, which is what GitHub does too.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

# The language switcher, in the theme's own slot for it.
#
# `extra.alternate` renders `partials/alternate.html`: a translate icon in
# the header, on the same row as the palette toggle and the search box.
# That is the pattern a reader already knows, and it costs no custom
# markup.  A button in the content area -- what this site had first --
# reads as part of the page rather than as a site-wide control.
#
# The links are absolute because the switcher appears on pages at
# different depths, and they point at the other language's front page
# rather than a translation of the current one: only the front page and
# the API reference exist in Chinese, so any other target would be a 404.
extra:
  alternate:
    - name: English
      link: https://binracer.github.io/KernLens/
      lang: en
    - name: 简体中文
      link: https://binracer.github.io/KernLens/zh-CN/
      lang: zh-CN

validation:
  # Absolute links go to GitHub, the issue tracker, and the PyPI project
  # page; they are not claims about files in this site.
  links:
    absolute_links: ignore
    unrecognized_links: warn
  anchors: warn

hooks:
  # `theme.language` is one value for the whole site, so the Chinese pages
  # would be served as `lang="en"` -- which also gives them an English
  # search stemmer.  The hook rewrites the attribute per page.
  - hooks/language.py

nav:
  - Overview: index.md
  - Commands: commands.md
  - Tutorial: tutorial/README.md
  - Demo container: demo-container.md
  - Python API: api.md
  - Architecture: architecture.md
  - Compatibility: compatibility.md
  - Releasing: releasing.md
  - Naming: naming.md
  # Outside the site directory, so these stay on GitHub rather than
  # becoming a second copy that drifts.
  - Contributing: https://github.com/BinRacer/KernLens/blob/main/CONTRIBUTING.md
  - Security: https://github.com/BinRacer/KernLens/blob/main/SECURITY.md
  - Changelog: https://github.com/BinRacer/KernLens/blob/main/CHANGELOG.md

# The Chinese pages are published but deliberately not in the nav.
#
# Choosing a language is the header switcher's job (`extra.alternate`
# above), and it is on every page.  Listing the same language a second
# time as a nav section made it look like a table of contents entry, so
# the sidebar showed "简体中文" as though it were a chapter of the
# documentation -- two controls for one decision, one of them in the
# wrong place.
#
# `not_in_nav` is how mkdocs says "this file is published on purpose and
# its absence from the nav is not an oversight".  Without it, `--strict`
# treats the omission as a warning and the build fails; that warning is
# otherwise exactly right, which is why the entries are declared rather
# than the check being relaxed.
not_in_nav: |
  zh-CN/*.md
