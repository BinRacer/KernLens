[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kernlens"
version = "0.3.0"
description = "KernLens: pure-Python Linux kernel introspection for GDB, including x86_64 page-table math, SLUB inspection, symbol/KASLR helpers, and ANSI diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "BinRacer", email = "native.lab@outlook.com" },
]
keywords = [
  "kernel",
  "debugging",
  "introspection",
  "gdb",
  "slub",
  "page-table",
  "x86-64",
  "exploit-development",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Operating System Kernels :: Linux",
  "Typing :: Typed",
]
dependencies = [
  "typing-extensions>=4.6; python_version < '3.12'",
]

[project.scripts]
kernlens = "kernlens.cli:main"

[project.urls]
Homepage = "https://github.com/BinRacer/KernLens"
Repository = "https://github.com/BinRacer/KernLens"
Issues = "https://github.com/BinRacer/KernLens/issues"

[dependency-groups]
dev = [
  "mypy>=2.4.0",
  "pyright>=1.1.400",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "types-gdb>=16.3.0.20260712",
]
# Building the documentation site is not part of `uv sync`; the docs job
# in CI asks for this group explicitly, so a contributor who only runs the
# test suite does not download a theme.
docs = ["mkdocs-material>=9.5"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kernlens = ["py.typed", "gdbinit.py"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["kernlens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
# The package ships an empty ``py.typed``, which promises that checking it
# is useful.  This is the gate behind that promise: ``uv run pyright`` is
# part of CI, so an annotation that stops resolving fails a commit.
#
# Only the package is checked.  ``examples/`` are scripts written to be
# sourced inside GDB and deliberately reach for globals GDB injects, so
# they are validated by their own capture tests instead.
include = ["src/kernlens"]
typeCheckingMode = "standard"
pythonVersion = "3.10"
# ``gdb`` only exists inside GDB: it is shipped as a stub-only
# distribution (``types-gdb``) so both checkers see the same types, and
# there is never a runtime module next to it to fall back to.
reportMissingModuleSource = "none"

[tool.mypy]
# Second opinion on the same ``py.typed`` promise.  pyright and mypy do
# not agree on every inference, and the disagreements found so far were
# real (cache slots the mixins could not assign, a ``**dict`` that hid a
# dataclass constructor).  ``types-gdb`` gives mypy the same ``gdb``
# stubs pyright resolves, so both check the same code.
files = ["src/kernlens"]
strict = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
extend-exclude = [".tools", ".piptmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
