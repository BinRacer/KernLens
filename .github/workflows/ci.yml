name: CI

on:
  push:
    branches: ["main"]
    # Skip a doc-only push.  The READMEs are deliberately absent: both are
    # asserted by tests/integration/test_gdbinit.py (their command tables
    # must match the frozen contract), so a README edit has to run the
    # suite.  Kept on ``push`` only -- filtering ``pull_request`` too would
    # leave a required check permanently pending on a doc-only PR, because
    # no run would ever be created for it.
    paths-ignore:
      - "CHANGELOG.md"
      - "CREDITS.md"
      - "LICENSE"
      - "docs/**"
      - "images/**"
      - "examples/api/gdbinit.example"
  pull_request:
  # Lets a run be started (or re-run) by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run it superseded, so a burst
# of pushes does not queue several full matrices behind each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        # Pinned to an exact version on purpose: astral-sh/setup-uv stopped
        # publishing rolling major aliases after v7, so ``@v10`` does not
        # exist.  ``@v7`` would work but would miss three majors of fixes.
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync environment from lockfile
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        # ``py.typed`` claims this package can be checked; this is the job
        # that keeps the claim true.  It is not covered by pytest because
        # pyright resolves ``gdb`` through the ``types-gdb`` dev stub.
        # The config pins pythonVersion, so one matrix entry is enough.
        if: matrix.python-version == '3.10'
        run: uv run --frozen pyright

      - name: Type check (mypy)
        # A second checker over the same `py.typed` claim.  pyright and
        # mypy disagree on some inferences, and every disagreement found
        # so far was a real defect (see `[tool.mypy]` in pyproject.toml).
        # `types-gdb` is a dev dependency, so both read the same `gdb`
        # stub and check the same code; like pyright, one entry is enough
        # because the target version is pinned in the config.
        if: matrix.python-version == '3.10'
        run: uv run --frozen mypy

      - name: Test
        run: uv run --frozen pytest --cov=kernlens --cov-report=term-missing

      - name: Test under the stdlib runner
        # A second configuration, not a duplicate run.  The suite claims
        # to be unittest-compatible, and CONTRIBUTING tells a reader to
        # run it that way, but nothing checked either claim: the paths
        # ``tests/conftest.py`` injects are installed by pytest's
        # ``pythonpath`` setting, which does nothing outside pytest, so
        # the documented command left ``contract_spec``,
        # ``example_manifest``, ``abi_ranges`` and the mkdocs hook
        # unimportable and reported 10 unit modules plus 4 integration
        # tests as import errors that had nothing to do with the code.
        #
        # ``filterwarnings = ["error"]`` is also pytest-only, so this
        # run sees warnings the one above turns into failures.  One
        # interpreter is enough: the difference being guarded is the
        # runner, not the version, and the version-specific surface is
        # covered by the matrix above.
        if: matrix.python-version == '3.10'
        run: |
          set -eu
          # ``tests`` for the frozen contract and the manifests,
          # ``tools`` for the generators, ``hooks`` for the mkdocs hook.
          # Keep this list equal to ``tests/conftest.py``.
          export PYTHONPATH=tests:tools:hooks
          uv run --frozen python -m unittest discover -s tests/unit
          uv run --frozen python -m unittest discover -s tests/integration

      - name: Verify the tutorial matches its capture
        run: |
          set -eu
          # The tutorial shows real command output, so it is generated
          # from a recorded capture rather than written by hand.  --check
          # re-renders and fails when a page and the capture disagree,
          # which is the only way this can be verified without a debuggee.
          uv run --frozen python tools/gen_tutorial.py \
            --capture tools/tutorial_capture.json \
            --meta tools/tutorial_meta.json \
            --out docs/en/tutorial --check
          # The command pages are English-only; each language still gets
          # its own index frame, and both must agree with the capture.
          uv run --frozen python tools/gen_tutorial_index.py \
            --capture tools/tutorial_capture.json \
            --meta tools/tutorial_meta.json \
            --out docs/en/tutorial --locale en --check
          uv run --frozen python tools/gen_tutorial_index.py \
            --capture tools/tutorial_capture.json \
            --meta tools/tutorial_meta.json \
            --out docs/zh-CN/tutorial --locale zh-CN --check
          # The README demo and the command table are generated from the
          # same capture/metadata.  A hand edit to either asset fails here.
          uv run --frozen python tools/gen_demo.py --check
          uv run --frozen python tools/gen_commands.py --check
          # ``tools/gen_tutorial_meta.py`` is not checked here: it reads
          # the live command registry, which imports ``gdb``, and this
          # runner has no GDB.  ``tests/integration/test_gdbinit.py``
          # compares the checked-in metadata against the registry through
          # the fake ``gdb`` it already installs, which is the same check
          # without the dependency.

      - name: Verify the examples match their manifest
        run: |
          set -eu
          # The examples are the only place the API is shown used end to
          # end, and nothing used to check them: no test imported them and
          # no table said what they were supposed to cover, so a claim
          # like "the examples show the allocator API" could not be
          # falsified.  tools/example_manifest.py is that table, and this
          # fails when a claim and the code disagree -- including a
          # command that an example only names in prose without running.
          uv run --frozen python tools/check_examples.py --check
          # The report is printed for the log, so a reviewer can see the
          # coverage a green build actually corresponds to.
          uv run --frozen python tools/check_examples.py --report
          # The numbers in examples/README.md are rendered from that same
          # measurement.  They used to be typed by hand and had gone
          # stale; --check fails when the file and the measurement drift.
          uv run --frozen python tools/gen_examples_readme.py --check

      - name: Run the examples that need no debugger
        run: |
          set -eu
          # The test suite already covers these through
          # tests/integration/test_examples_pure.py, but running them here
          # as *scripts* is a different claim: the suite imports nothing
          # and would not notice a broken `if __name__ == "__main__"`
          # guard.  This is the check that says "a reader can copy the
          # command from the README and it works".
          #
          # Only rows declaring runs_on="host" are listed, and the list is
          # derived from the manifest by the Python one-liner, so it cannot
          # fall out of step with it.
          uv run --frozen python - <<'PY'
          import pathlib, subprocess, sys
          sys.path.insert(0, "tools")
          import example_manifest
          root = pathlib.Path(".").resolve()
          failed = []
          for example in example_manifest.EXAMPLES:
              if example.runs_on != "host":
                  continue
              result = subprocess.run(
                  [sys.executable, example.path, *example.argv],
                  cwd=root, capture_output=True, text=True,
              )
              status = "ok" if result.returncode == 0 else "FAILED"
              print(f"{status:6} {example.path}")
              if result.returncode != 0:
                  failed.append(example.path)
                  print(result.stderr[-2000:])
          sys.exit(1 if failed else 0)
          PY

      - name: Verify the examples match their GDB capture
        run: |
          set -eu
          # Most examples need a live kernel, so they cannot be executed
          # here.  What *can* be checked without a debuggee is that the
          # recorded shape of a real run -- the sections each example
          # printed, and whether it survived -- still matches the tree.
          # tools/run_examples_gdb.py writes that record from inside GDB;
          # this re-derives the expected shape from the record and fails
          # when a heading the record lists no longer exists in the
          # source, which is what a renamed or deleted section looks like.
          uv run --frozen python tools/check_example_capture.py

      - name: Verify the layout generator probes a real kernel
        run: |
          set -eu
          # No bpftool needed: the probe uses the project's own BTF parser.
          # (Ubuntu's bpftool package installs a *wrapper* that dispatches
          # to a per-kernel tools package and fails on a cloud runner.)
          if [ ! -r /sys/kernel/btf/vmlinux ]; then
            echo "no BTF on this runner; skipping"
            exit 0
          fi
          # The runner kernel differs from the verified one, so only the
          # probe's coverage is asserted here -- that it resolved every
          # struct the registry claims *for this release*.  --check would
          # be wrong: it compares offsets, which the registry only
          # guarantees for the kernels it was verified against.
          #
          # The release has to be passed, because a struct can legitimately
          # be absent from a newer kernel: `struct kmem_cache_cpu` was
          # replaced by sheaves at 7.0, so demanding it from a 7.0 probe
          # reports a healthy parse as a failure.  Without --version the
          # check falls back to claiming every entry, which is the strict
          # behaviour wanted when the kernel cannot be identified.
          release="$(uname -r | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')"
          uv run --frozen python tools/gen_layouts.py \
            --btf /sys/kernel/btf/vmlinux \
            --coverage --version "$release"

      - name: Build distributions
        run: |
          set -eu
          uv build
          # The wheel must contain the startup file and the console
          # script, not only the Python modules: GDB sources
          # `kernlens/gdbinit.py` from site-packages, and `kernlens path`
          # is how a user finds it.  The old source-only policy existed
          # because that was impossible; this is the check that it stays
          # possible.
          uv run --frozen python tools/check_wheel.py dist/*.whl
          # The py.typed source file is only a claim about the checkout;
          # the marker has to be inside the artifacts for a pip user to
          # benefit.  Assert both, because package-data and MANIFEST.in
          # are separate switches and either can silently stop applying.
          uv run --frozen python - <<'PY'
          import glob, tarfile

          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
          for required in (
              "src/kernlens/py.typed",
              "src/kernlens/gdbinit.py",
              "gdbinit.py",
              "install.sh",
          ):
              assert any(
                  name.endswith("/" + required) for name in names
              ), (sdist, required)
          print("sdist ships py.typed, the startup file and the installer")
          PY
