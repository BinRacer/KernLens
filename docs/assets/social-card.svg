<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">KernLens — read a live Linux kernel from GDB</title>
  <desc id="desc">KernLens adds 30 commands to GDB for reading page tables, SLUB caches and struct page from a running x86_64 Linux kernel.</desc>

  <!-- Background: dark terminal, matching the docs theme. -->
  <rect width="1200" height="630" fill="#1b1f23"/>
  <rect x="0" y="0" width="1200" height="6" fill="#4a9eff"/>

  <!-- Wordmark -->
  <text x="80" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="76" font-weight="700" fill="#e6edf3">Kern<tspan fill="#4a9eff">Lens</tspan></text>
  <text x="80" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#8b949e">read a live Linux kernel from GDB</text>

  <!-- The one thing a screenshot has to prove: real output, decoded. -->
  <rect x="80" y="238" width="1040" height="292" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <circle cx="108" cy="266" r="7" fill="#ff5f56"/>
  <circle cx="132" cy="266" r="7" fill="#ffbd2e"/>
  <circle cx="156" cy="266" r="7" fill="#27c93f"/>
  <text x="184" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6e7681">gdb — 6.1.134</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
    <text x="108" y="318" fill="#8b949e">(gdb) <tspan fill="#e6edf3">kl-walk 0xffff975280400000</tspan></text>
    <text x="108" y="352" fill="#e6edf3">VA: <tspan fill="#d2a8ff">0xffff975280400000</tspan></text>
    <text x="108" y="382" fill="#7ee787">pgd      : idx=0x12e  entry=0x3010970  value=0x4a01067 -&gt; 0x4a01000</text>
    <text x="108" y="412" fill="#7ee787">pud      : idx=0x14a  entry=0x4a01a50  value=0x4a02067 -&gt; 0x4a02000</text>
    <text x="108" y="442" fill="#7ee787">pmd      : idx=0x2    entry=0x4a02010  value=0x80000000004000e3</text>
    <text x="108" y="472" fill="#ffa657">Leaf: 2 MiB huge  pa=0x400000  offset=0x0</text>
    <text x="108" y="502" fill="#8b949e">Flags: <tspan fill="#4a9eff">P RW A D PAT PS NX</tspan></text>
  </g>

  <!-- What it covers, in the reader's vocabulary rather than ours. -->
  <text x="80" y="578" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#8b949e">page tables · SLUB freelists · struct page · symbols · KASLR</text>
</svg>